[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-video-structural-anomaly"
version = "0.1.0"
description = "Object-aware 3D structural residuals for forged video anomaly detection prototypes."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "pillow>=10.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
yolo = ["ultralytics==8.4.90"]
depth = ["transformers==5.13.0", "pillow==12.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
