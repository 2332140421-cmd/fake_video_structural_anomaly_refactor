[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-video-structural-anomaly"
version = "0.1.0"
description = "Object-aware 3D structural residuals for forged video anomaly detection prototypes."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
yolo = ["ultralytics>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
