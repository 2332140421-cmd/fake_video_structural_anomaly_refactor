schema_version: 1
candidate_version: physical_candidates_2026_07_14
created_at: "2026-07-14T00:00:00+08:00"
reviewed_at: "2026-07-14"
independence_statement: >-
  Candidate values are derived only from the cited public sources. No projected
  area, monocular depth, residual, label outcome, or NaN result from the pilot
  real/fake videos was used to estimate or widen a physical interval.

global_characteristic_dimension:
  name: equivalent_reference_silhouette_linear_scale
  definition: >-
    sqrt(reference frontal physical height * reference frontal physical width).
    This is a physical linear proxy corresponding to sqrt(projected area), up
    to camera scale and silhouette occupancy. For a sphere, height and width
    both equal physical diameter.
  unit: m

audit_policy:
  allowed_unit: m
  max_interval_ratio: 2.5
  minimum_product_spec_sources: 3
  minimum_product_spec_publishers: 2
  accepted_statistical_source_count: 1
  strict_enabled_status: reliable_single

scale_prior_candidates:
  person:
    characteristic_dimension: equivalent_reference_silhouette_linear_scale
    dimension_definition: sqrt(standing stature * frontal inter-scye breadth)
    unit: m
    min: 0.694576
    max: 0.929007
    estimation_method: public_anthropometric_percentile_envelope
    interval_basis: sample_statistics
    source_count: 1
    sources:
      - source_id: nasa_crew_anthropometry_2025
        title: Crew Anthropometry and Spacesuit Sizing
        publisher: NASA
        url: https://ntrs.nasa.gov/api/citations/20250003042/downloads/UMN%20Lecture%202025.pdf
        source_type: public_anthropometric_statistics
        used_for_interval: true
        dimensions: stature_and_inter_scye_breadth_percentiles
        unit: cm
        conversion_to_m: 0.01
        note: Female 5th to male 95th percentile values derived from NASA-STD-3000 tables.
    reliability: pending_audit
    reliability_reason: pending reproducible audit
    pose_sensitivity: medium
    multimodal_warning: true
    multimodal_reason: YOLO person includes children and adults, while the cited interval is adult crew anthropometry.
