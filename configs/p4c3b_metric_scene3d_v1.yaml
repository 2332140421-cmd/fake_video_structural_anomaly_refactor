schema_version: semantic3d_p4c3b_metric_scene3d_v1
stage: P4-C3B-M2
inputs:
  metric_provider_smoke_root: outputs/p4c3b_metric_provider_smoke
  formal_observation_dataset_root: outputs/structural_enhancement_dataset/p4b5_six_video_full_observation
  source_names:
    - fake_1
    - real_1
  frame_indices:
    fake_1: [0, 1, 2]
    real_1: [30, 31, 32]
reconstruction:
  scene_stride: 16
  extent_quantile_low: 0.05
  extent_quantile_high: 0.95
  max_recorded_object_points: 2048
  boundary_sample_count: 32
  boundary_min_spacing_px: 4.0
  boundary_side_radius_px: 4
  internal_max_points: 24
  internal_erosion_pixels: 4
  internal_min_distance_px: 8.0
  internal_max_depth_mad_ratio: 0.08
  graph_knn_k: 3
  graph_radius_m: null
scope_constraints:
  coordinate_frame: camera_frame_metric
  world_frame_reconstruction: false
  cross_frame_fusion: false
  temporal_d3_residual: false
  training: false
  distribution_fitting: false
  threshold_selection: false
  authenticity_performance_evaluation: false
