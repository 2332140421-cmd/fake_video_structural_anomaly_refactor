schema_version: 1
created_at: "2026-07-15"
independence_statement: >-
  These generic image-quality rules were defined before strict v2 evaluation.
  No projection, depth, residual, label outcome, or NaN from the pilot six
  videos was used to select or tune a threshold.

global_validation:
  min_bbox_width_px: 8.0
  min_bbox_height_px: 8.0
  min_area_ratio: 0.0001
  max_area_ratio: 0.98

measurement_types:
  bbox_height_norm:
    compatibility_group: vertical_extent
    formula: bbox_height / frame_height
    required_geometry: bbox

  bbox_width_norm:
    compatibility_group: horizontal_extent
    formula: bbox_width / frame_width
    required_geometry: bbox

  equivalent_diameter_norm:
    compatibility_group: radial_extent
    formula: sqrt(4 * projected_area / pi) / sqrt(frame_width * frame_height)
    required_geometry: mask_area_or_bbox_area
    prefer_mask_area: true
    bbox_fallback_quality: approximate

  bbox_diagonal_norm:
    compatibility_group: diagonal_extent
    formula: sqrt((bbox_width / frame_width)^2 + (bbox_height / frame_height)^2)
    required_geometry: bbox

compatibility_policy:
  allow_same_group_only: true
  allow_cross_axis_conversion: false
  reason: camera intrinsics and cross-axis calibration are unavailable

