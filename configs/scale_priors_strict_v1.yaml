  prior_source: physical
  independent_of_evaluation_videos: true
  characteristic_dimension:
    name: equivalent_reference_silhouette_linear_scale
    definition: sqrt(reference frontal physical height * reference frontal physical
      width). This is a physical linear proxy corresponding to sqrt(projected area),
      up to camera scale and silhouette occupancy. For a sphere, height and width
      both equal physical diameter.
    unit: m
scale_priors:
  ball:
    characteristic_dimension: equivalent_reference_silhouette_linear_scale
    dimension_definition: spherical physical diameter derived from circumference
    unit: m
    min: 0.216451
    max: 0.222817
    estimation_method: official_standard_formula_circumference_divided_by_pi
    source_count: 1
    sources:
    - source_id: ifab_law_2_football
      title: Law 2 - The Ball, qualities and measurements
      publisher: The International Football Association Board
      url: https://www.theifab.com/laws/latest/the-ball/
      source_type: official_standard
      used_for_interval: true
      dimensions: circumference_converted_to_diameter
      unit: cm
      conversion_to_m: 0.01
      note: Official football circumference is 68-70 cm; diameter is circumference
        divided by pi.
    audit_status: conditional_multimodal
    reliable: false
    reliability_reason: The YOLO COCO source label is sports ball, which includes
      non-football ball sizes before project mapping.
    pose_sensitivity: low
    multimodal_warning: true
    reviewed_at: '2026-07-14'
    prior_version: strict_physical_v1
  cup:
    characteristic_dimension: equivalent_reference_silhouette_linear_scale
    dimension_definition: sqrt(upright vessel body height * body diameter)
    unit: m
    min: 0.0762
    max: 0.10183
    estimation_method: multi_publisher_product_specification_envelope
    source_count: 4
    sources:
    - source_id: ikea_stockholm_2025_tumbler
      title: STOCKHOLM 2025 tumbler, 7 oz
      publisher: IKEA
      url: https://www.ikea.com/us/en/p/stockholm-2025-tumbler-brown-00592417/
      source_type: manufacturer_specification
      used_for_interval: true
      dimensions: height_and_diameter
      unit: in
      conversion_to_m: 0.0254
      note: Height 3 in; diameter 3 in.
    - source_id: ikea_piggal_mug
      title: PIGGAL mug, 10 oz
      publisher: IKEA
      url: https://www.ikea.com/us/en/p/piggal-mug-white-green-50561828/
      source_type: manufacturer_specification
      used_for_interval: true
      dimensions: height_and_diameter
      unit: in
      conversion_to_m: 0.0254
      note: Height 3 in; diameter 4 in.
    - source_id: ikea_fargklar_mug
      title: FARGKLAR mug, 14 oz
      publisher: IKEA
      url: https://www.ikea.com/us/en/p/faergklar-mug-light-blue-70604879/
      source_type: manufacturer_specification
      used_for_interval: true
      dimensions: height_and_diameter
      unit: in
      conversion_to_m: 0.0254
      note: Height 4 in; diameter 4 in.
    - source_id: hydroflask_12oz_mug
      title: Hydro Flask 12 oz Mug
      publisher: Hydro Flask
      url: https://www.hydroflask.com/gb/hydroflask-12-oz-mug
      source_type: manufacturer_specification
      used_for_interval: true
      dimensions: height_and_diameter
      unit: cm
      conversion_to_m: 0.01
      note: Product height 11.56 cm; diameter 8.97 cm.
    audit_status: conditional_multimodal
    reliable: false
    reliability_reason: COCO cup combines tabletop cups, mugs, tumblers, and travel
      vessels with distinct aspect modes.
    pose_sensitivity: medium
    multimodal_warning: true
    reviewed_at: '2026-07-14'
    prior_version: strict_physical_v1
  person:
    characteristic_dimension: equivalent_reference_silhouette_linear_scale
    dimension_definition: sqrt(standing stature * frontal inter-scye breadth)
    unit: m
    min: 0.694576
    max: 0.929007
    estimation_method: public_anthropometric_percentile_envelope
    source_count: 1
    sources:
    - source_id: nasa_crew_anthropometry_2025
      title: Crew Anthropometry and Spacesuit Sizing
      publisher: NASA
      url: https://ntrs.nasa.gov/api/citations/20250003042/downloads/UMN%20Lecture%202025.pdf
      source_type: public_anthropometric_statistics
      used_for_interval: true
      dimensions: stature_and_inter_scye_breadth_percentiles
      unit: cm
      conversion_to_m: 0.01
      note: Female 5th to male 95th percentile values derived from NASA-STD-3000 tables.
    audit_status: conditional_multimodal
    reliable: false
    reliability_reason: YOLO person includes children and adults, while the cited
      interval is adult crew anthropometry.
    pose_sensitivity: medium
    multimodal_warning: true
    reviewed_at: '2026-07-14'
    prior_version: strict_physical_v1
